<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="dashboard.css"></head>
<body>
<header><div class="brand">🎮 GameZone <span>Admin Module</span></div><nav><a href="index.html">Home</a><button id="logout" class="danger">Logout</button></nav></header>
<main>
<section class="welcome"><div><p class="tag">ADMIN MODULE</p><h1>Admin Dashboard ⚙️</h1><p>Manage tournaments and view registered players.</p></div></section>
<section class="stats"><div><b id="tCount">0</b><small>Total Tournaments</small></div><div><b id="rCount">0</b><small>Total Registrations</small></div><div><b id="uCount">0</b><small>Registered Users</small></div></section>
<section class="admin-layout">
<div>
<div class="section-head"><h2>Tournament Management</h2><button class="primary" onclick="openForm()">+ Add Tournament</button></div>
<div id="tournaments" class="admin-list"></div>
</div>
<div>
<h2>Recent Registrations</h2><div id="registrations" class="registrations"></div>
</div>
</section>
</main>
<div id="formModal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeForm()">×</button><h2 id="formTitle">Add Tournament</h2><form id="tForm">
<input id="tid" type="hidden"><input id="name" placeholder="Tournament name" required>
<input id="game" placeholder="Game name (e.g. BGMI)" required>
<input id="icon" placeholder="Emoji icon (e.g. 🎮)" required>
<input id="date" type="date" required><input id="time" placeholder="Time (e.g. 6:00 PM)" required>
<input id="prize" placeholder="Prize pool (e.g. ₹10,000)" required><input id="slots" type="number" min="1" placeholder="Slots" required>
<button class="primary" type="submit">Save Tournament</button>
</form></div></div>
<script src="admin.js"></script>
</body></html>
